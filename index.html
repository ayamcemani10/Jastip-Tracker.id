<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JastipLive | Tracker Pesanan</title>
    <style>
        /* Desain UI Minimalis & Bersih */
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #2c3e50; margin-bottom: 5px; }
        
        /* Dashboard Cards */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); text-align: center; border-top: 4px solid #0074e4; }
        .card.profit { border-top: 4px solid #00b06f; background: #f0fdf6; }
        .card h3 { margin: 0 0 10px 0; color: #7f8c8d; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; }
        .card p { margin: 0; font-size: 1.8rem; font-weight: bold; color: #2c3e50; }
        .card.profit p { color: #00b06f; }

        /* Form Input */
        .form-container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); margin-bottom: 25px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        label { font-size: 0.85rem; font-weight: bold; color: #34495e; margin-bottom: 5px; display: block; }
        input, select { width: 100%; padding: 10px; border: 1px solid #dcdde1; border-radius: 6px; font-size: 1rem; }
        input:focus, select:focus { outline: none; border-color: #0074e4; }
        
        .btn-submit { background: #0074e4; color: white; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 15px; transition: 0.2s; }
        .btn-submit:hover { background: #005bb5; }
        .preview-profit { text-align: right; font-size: 0.9rem; margin-top: 10px; color: #7f8c8d; }

        /* Tabel Data */
        .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #f1f2f6; }
        th { background: #f8f9fa; color: #2c3e50; font-weight: bold; }
        
        .status-btn { padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        .status-pending { background: #ffeaa7; color: #d35400; }
        .status-done { background: #55efc4; color: #00b894; }
        .btn-delete { background: #ff7675; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🌍 JastipLive Tracker</h1>
            <p>Sistem Pencatatan Multi-Currency & Kalkulasi Margin Otomatis</p>
            <select id="filterTrip" onchange="renderApp()" style="max-width: 300px; margin: 10px auto; display: block;">
                <option value="ALL">Lihat Semua Trip</option>
                <option value="Jepang-Okt">✈️ Luar Negeri: Jepang (Okt)</option>
                <option value="Singapura-Nov">✈️ Luar Negeri: Singapura (Nov)</option>
                <option value="Domestik-Sby">🚚 Domestik: Surabaya</option>
            </select>
        </div>

        <!-- Dashboard Angka -->
        <div class="dashboard">
            <div class="card">
                <h3>Total Modal (HPP)</h3>
                <p id="dashModal">Rp 0</p>
            </div>
            <div class="card">
                <h3>Total Omzet Jual</h3>
                <p id="dashOmzet">Rp 0</p>
            </div>
            <div class="card profit">
                <h3>Total Profit Bersih</h3>
                <p id="dashProfit">Rp 0</p>
            </div>
        </div>

        <!-- Form Input Pesanan -->
        <div class="form-container">
            <form id="jastipForm">
                <div class="form-grid">
                    <div>
                        <label>Pilih Trip Aktif</label>
                        <select id="inputTrip" required>
                            <option value="Jepang-Okt">Jepang (Okt)</option>
                            <option value="Singapura-Nov">Singapura (Nov)</option>
                            <option value="Domestik-Sby">Domestik Surabaya</option>
                        </select>
                    </div>
                    <div><label>Nama Customer</label><input type="text" id="inputName" placeholder="Contoh: Budi" required></div>
                    <div><label>Nama Barang</label><input type="text" id="inputItem" placeholder="Contoh: Sepatu Nike" required></div>
                    
                    <div>
                        <label>Mata Uang (Beli)</label>
                        <select id="inputCurrency" onchange="autoFillKurs()">
                            <option value="JPY">¥ JPY (Yen Jepang)</option>
                            <option value="SGD">$ SGD (Dolar SG)</option>
                            <option value="USD">$ USD (Dolar AS)</option>
                            <option value="IDR">Rp IDR (Rupiah)</option>
                        </select>
                    </div>
                    <div><label>Harga Beli (Di Toko)</label><input type="number" id="inputPriceForeign" step="any" required oninput="calcPreview()"></div>
                    <div><label>Kurs ke IDR saat ini</label><input type="number" id="inputKurs" value="106" required oninput="calcPreview()"></div>
                    <div><label>Harga Jual ke Customer (Rp)</label><input type="number" id="inputPriceSell" required oninput="calcPreview()"></div>
                </div>
                
                <div class="preview-profit">
                    Estimasi Modal: <span id="prevModal" style="font-weight:bold;">Rp 0</span> | 
                    Estimasi Profit: <span id="prevProfit" style="font-weight:bold; color:#00b06f;">Rp 0</span>
                </div>
                
                <button type="submit" class="btn-submit">➕ Tambahkan ke Tracker</button>
            </form>
        </div>

        <!-- Tabel Pesanan -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Barang</th>
                        <th>Harga Beli Asli</th>
                        <th>Modal (IDR)</th>
                        <th>Harga Jual (IDR)</th>
                        <th>Margin (IDR)</th>
                        <th>Status</th>
                        <th>Hapus</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data dari JavaScript akan muncul di sini -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Simulasi Kurs Default
        const defaultKurs = { 'JPY': 106, 'SGD': 11800, 'USD': 15500, 'IDR': 1 };
        
        // Mengambil data dari LocalStorage
        let orders = JSON.parse(localStorage.getItem('jastipOrders')) || [];

        // Format Uang Rupiah
        const formatIDR = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);

        // Autofill Kurs jika Mata Uang diganti
        function autoFillKurs() {
            const currency = document.getElementById('inputCurrency').value;
            const kursInput = document.getElementById('inputKurs');
            kursInput.value = defaultKurs[currency];
            
            // Jika IDR (Domestik), kunci kurs di angka 1
            if(currency === 'IDR') {
                kursInput.readOnly = true;
            } else {
                kursInput.readOnly = false;
            }
            calcPreview();
        }

        // Hitung Live Preview di Bawah Form
        function calcPreview() {
            const priceForeign = parseFloat(document.getElementById('inputPriceForeign').value) || 0;
            const kurs = parseFloat(document.getElementById('inputKurs').value) || 0;
            const priceSell = parseFloat(document.getElementById('inputPriceSell').value) || 0;
            
            const modalIDR = priceForeign * kurs;
            const profitIDR = priceSell - modalIDR;

            document.getElementById('prevModal').innerText = formatIDR(modalIDR);
            document.getElementById('prevProfit').innerText = formatIDR(profitIDR);
        }

        // Tambah Data Baru
        document.getElementById('jastipForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const trip = document.getElementById('inputTrip').value;
            const name = document.getElementById('inputName').value;
            const item = document.getElementById('inputItem').value;
            const currency = document.getElementById('inputCurrency').value;
            const priceForeign = parseFloat(document.getElementById('inputPriceForeign').value);
            const kurs = parseFloat(document.getElementById('inputKurs').value);
            const priceSell = parseFloat(document.getElementById('inputPriceSell').value);

            const modalIDR = priceForeign * kurs;
            const margin = priceSell - modalIDR;

            const newOrder = {
                id: Date.now(),
                trip, name, item, currency, priceForeign, kurs, modalIDR, priceSell, margin,
                status: 'Belum Dibelikan'
            };

            orders.push(newOrder);
            saveData();
            this.reset();
            autoFillKurs();
            document.getElementById('prevModal').innerText = "Rp 0";
            document.getElementById('prevProfit').innerText = "Rp 0";
            renderApp();
        });

        // Hapus Data
        function deleteOrder(id) {
            if(confirm("Yakin ingin menghapus pesanan ini?")) {
                orders = orders.filter(order => order.id !== id);
                saveData();
                renderApp();
            }
        }

        // Ubah Status (Toggle)
        function toggleStatus(id) {
            let order = orders.find(o => o.id === id);
            if(order.status === 'Belum Dibelikan') order.status = 'Sudah Dibelikan ✅';
            else order.status = 'Belum Dibelikan';
            saveData();
            renderApp();
        }

        function saveData() {
            localStorage.setItem('jastipOrders', JSON.stringify(orders));
        }

        // Render UI (Tabel & Dashboard)
        function renderApp() {
            const filter = document.getElementById('filterTrip').value;
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            let totalModal = 0, totalOmzet = 0, totalProfit = 0;

            orders.forEach(order => {
                if (filter !== 'ALL' && order.trip !== filter) return; // Skip jika tidak sesuai filter

                totalModal += order.modalIDR;
                totalOmzet += order.priceSell;
                totalProfit += order.margin;

                const statusClass = order.status === 'Belum Dibelikan' ? 'status-pending' : 'status-done';

                tbody.innerHTML += `
                    <tr>
                        <td><strong>${order.name}</strong><br><small style="color:#7f8c8d;">${order.trip}</small></td>
                        <td>${order.item}</td>
                        <td>${order.priceForeign} ${order.currency} <br><small>Kurs: ${order.kurs}</small></td>
                        <td>${formatIDR(order.modalIDR)}</td>
                        <td><strong>${formatIDR(order.priceSell)}</strong></td>
                        <td style="color:#00b06f; font-weight:bold;">${formatIDR(order.margin)}</td>
                        <td><button class="status-btn ${statusClass}" onclick="toggleStatus(${order.id})">${order.status}</button></td>
                        <td><button class="btn-delete" onclick="deleteOrder(${order.id})">✖</button></td>
                    </tr>
                `;
            });

            // Update Dashboard
            document.getElementById('dashModal').innerText = formatIDR(totalModal);
            document.getElementById('dashOmzet').innerText = formatIDR(totalOmzet);
            document.getElementById('dashProfit').innerText = formatIDR(totalProfit);
        }

        // Inisialisasi awal
        window.onload = () => {
            autoFillKurs();
            renderApp();
        };
    <script>
        // MASUKKAN URL GOOGLE APPS SCRIPT KAMU DI BAWAH INI:
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxI-eTyMFFSdfwusln_5UkJVrxKjAIia3qhbKQzd4naNFfbbrfjbL9QsbYJFWebwCTZ/exec';
        
        const defaultKurs = { 'JPY': 106, 'SGD': 11800, 'USD': 15500, 'IDR': 1 };
        let orders = JSON.parse(localStorage.getItem('jastipOrders')) || [];

        const formatIDR = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);

        function autoFillKurs() {
            const currency = document.getElementById('inputCurrency').value;
            const kursInput = document.getElementById('inputKurs');
            kursInput.value = defaultKurs[currency];
            kursInput.readOnly = currency === 'IDR';
            calcPreview();
        }

        function calcPreview() {
            const priceForeign = parseFloat(document.getElementById('inputPriceForeign').value) || 0;
            const kurs = parseFloat(document.getElementById('inputKurs').value) || 0;
            const priceSell = parseFloat(document.getElementById('inputPriceSell').value) || 0;
            
            const modalIDR = priceForeign * kurs;
            const profitIDR = priceSell - modalIDR;

            document.getElementById('prevModal').innerText = formatIDR(modalIDR);
            document.getElementById('prevProfit').innerText = formatIDR(profitIDR);
        }

        document.getElementById('jastipForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btnSubmit = document.querySelector('.btn-submit');
            btnSubmit.innerText = "⏳ Mengirim data ke Cloud...";
            btnSubmit.disabled = true;
            btnSubmit.style.background = "#95a5a6";
            
            const trip = document.getElementById('inputTrip').value;
            const name = document.getElementById('inputName').value;
            const item = document.getElementById('inputItem').value;
            const currency = document.getElementById('inputCurrency').value;
            const priceForeign = parseFloat(document.getElementById('inputPriceForeign').value);
            const kurs = parseFloat(document.getElementById('inputKurs').value);
            const priceSell = parseFloat(document.getElementById('inputPriceSell').value);

            const modalIDR = priceForeign * kurs;
            const margin = priceSell - modalIDR;

            const newOrder = {
                id: Date.now(),
                trip, name, item, currency, priceForeign, kurs, modalIDR, priceSell, margin,
                status: 'Belum Dibelikan'
            };

            // Mengirim data ke Google Sheets
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(newOrder),
                headers: { "Content-Type": "text/plain;charset=utf-8" }
            })
            .then(response => response.json())
            .then(data => {
                if(data.result === "success") {
                    // Jika sukses masuk ke Excel, simpan juga di HP/Laptop
                    orders.push(newOrder);
                    saveData();
                    this.reset();
                    autoFillKurs();
                    document.getElementById('prevModal').innerText = "Rp 0";
                    document.getElementById('prevProfit').innerText = "Rp 0";
                    renderApp();
                    
                    // Kembalikan tombol seperti semula
                    btnSubmit.innerText = "➕ Tambahkan ke Tracker";
                    btnSubmit.disabled = false;
                    btnSubmit.style.background = "#0074e4";
                }
            })
            .catch(error => {
                alert("Gagal mengirim ke server. Pastikan internet menyala.");
                btnSubmit.innerText = "➕ Tambahkan ke Tracker";
                btnSubmit.disabled = false;
                btnSubmit.style.background = "#0074e4";
            });
        });

        function deleteOrder(id) {
            if(confirm("Yakin ingin menghapus pesanan ini?")) {
                orders = orders.filter(order => order.id !== id);
                saveData();
                renderApp();
            }
        }

        function toggleStatus(id) {
            let order = orders.find(o => o.id === id);
            if(order.status === 'Belum Dibelikan') order.status = 'Sudah Dibelikan ✅';
            else order.status = 'Belum Dibelikan';
            saveData();
            renderApp();
        }

        function saveData() {
            localStorage.setItem('jastipOrders', JSON.stringify(orders));
        }

        function renderApp() {
            const filter = document.getElementById('filterTrip').value;
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            let totalModal = 0, totalOmzet = 0, totalProfit = 0;

            orders.forEach(order => {
                if (filter !== 'ALL' && order.trip !== filter) return; 

                totalModal += order.modalIDR;
                totalOmzet += order.priceSell;
                totalProfit += order.margin;

                const statusClass = order.status === 'Belum Dibelikan' ? 'status-pending' : 'status-done';

                tbody.innerHTML += `
                    <tr>
                        <td><strong>${order.name}</strong><br><small style="color:#7f8c8d;">${order.trip}</small></td>
                        <td>${order.item}</td>
                        <td>${order.priceForeign} ${order.currency} <br><small>Kurs: ${order.kurs}</small></td>
                        <td>${formatIDR(order.modalIDR)}</td>
                        <td><strong>${formatIDR(order.priceSell)}</strong></td>
                        <td style="color:#00b06f; font-weight:bold;">${formatIDR(order.margin)}</td>
                        <td><button class="status-btn ${statusClass}" onclick="toggleStatus(${order.id})">${order.status}</button></td>
                        <td><button class="btn-delete" onclick="deleteOrder(${order.id})">✖</button></td>
                    </tr>
                `;
            });

            document.getElementById('dashModal').innerText = formatIDR(totalModal);
            document.getElementById('dashOmzet').innerText = formatIDR(totalOmzet);
            document.getElementById('dashProfit').innerText = formatIDR(totalProfit);
        }

        window.onload = () => {
            autoFillKurs();
            renderApp();
        };
    </script>
</body>
</html>
